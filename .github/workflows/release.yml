name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${INPUT_VERSION#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python tools/build_release.py --version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: PositionHUD_v${{ steps.ver.outputs.version }}
          path: |
            dist/PositionHUD_v${{ steps.ver.outputs.version }}.unitypackage
            dist/PositionHUD_v${{ steps.ver.outputs.version }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PositionHUD_v${{ steps.ver.outputs.version }}.unitypackage
            dist/PositionHUD_v${{ steps.ver.outputs.version }}.zip
