[project]
name = "posehud-decoder"
version = "0.1.0"
description = "PositonHUD decoder"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "mss>=10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posehud"]
